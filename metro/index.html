<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>:root{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="../shim.js"></script>
</head>
<body>
<title>チェロのメトロノーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@400&display=swap">
<style>
/* 「ドヴォルザークへの道」と同じ夜の青と金。1画面で、大きな数字と拍の灯りを見ながら弾ける道具 */
:root {
  color-scheme: dark;
  --bg: #0a0f1a; --panel: #0f1727; --panel-2: #14203a; --ink: #ebe7dc; --muted: #8f95a1; --line: #22304a; --frame: #3a3322;
  --gold: #c9a54e; --gold-dim: #6e5a2c;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", serif; --f-fine: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif; --f-latin: "Cormorant Garamond", Garamond, serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-variant-numeric: lining-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
nav { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; border-bottom: 1px solid var(--frame); padding-bottom: 10px; }
nav a { color: var(--ink); text-decoration: none; } nav a:hover { color: var(--gold); } nav b { color: var(--gold); font-weight: 700; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: .08em; text-align: center; text-wrap: balance; }
.lead { margin: -8px 0 0; text-align: center; font-family: var(--f-fine); font-size: 13.5px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--frame); box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px #2b2618; padding: 24px 20px; display: grid; gap: 16px; justify-items: center; }
.big { display: flex; align-items: baseline; gap: 8px; }
.big b { font-family: var(--f-latin); font-weight: 700; font-size: 104px; line-height: .9; color: var(--gold); font-variant-numeric: lining-nums tabular-nums; }
.big span { font-size: 24px; color: var(--muted); }
.word { font-family: var(--f-fine); font-size: 14px; color: var(--muted); min-height: 1.4em; }
.dots { display: flex; gap: 14px; min-height: 22px; align-items: center; }
.dots i { width: 18px; height: 18px; border: 1.5px solid var(--gold-dim); transform: rotate(45deg); display: inline-block; transition: background .05s; }
.dots i.first { border-color: var(--gold); }
.dots i.on { background: var(--gold); box-shadow: 0 0 14px rgba(227,196,111,.7); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; font-size: 13px; width: 100%; }
#bpm { width: 100%; accent-color: var(--gold); }
select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); padding: 6px 10px; font: inherit; }
.btn { font-family: var(--f-latin); font-weight: 700; letter-spacing: .1em; font-size: 18px; color: #120d05; background: linear-gradient(180deg, #e0c272, var(--gold)); border: 0; padding: 12px 34px; cursor: pointer; }
.btn.stop { background: none; color: var(--gold); border: 1px solid var(--gold-dim); }
.ghost { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--gold-dim); padding: 8px 14px; cursor: pointer; min-width: 44px; }
.ghost:hover { border-color: var(--gold); }
.presets { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: 100%; }
.presets button { display: grid; justify-items: center; gap: 0; padding: 8px 4px; }
.presets b { font-family: var(--f-latin); font-size: 22px; line-height: 1; color: var(--gold); font-variant-numeric: lining-nums tabular-nums; }
.presets small { font-size: 10px; color: var(--muted); line-height: 1.3; text-align: center; }
.presets button[aria-pressed="true"] { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,165,78,.2), var(--panel-2)); }
label.chk { display: inline-flex; align-items: center; gap: 6px; }
label.chk input { accent-color: var(--gold); }
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.help { font-family: var(--f-fine); font-size: 13px; color: var(--muted); line-height: 1.9; margin: 0; }
.help b { color: var(--ink); font-family: var(--f-body); }
@media (prefers-reduced-motion: reduce) { .dots i { transition: none; } }
</style>

<div class="wrap">
  <nav aria-label="ページの切り替え">
    <a href="https://claude.ai/artifact/4jkVwChzQKFfxCUR8QBD3A" target="_blank" rel="noopener">ドヴォルザークへの道</a>
    <a href="https://claude.ai/artifact/JuFha8i4nhqDb6eZZaygpj" target="_blank" rel="noopener">楽譜帳</a>
    <a href="https://claude.ai/artifact/JKa7TVRz2XjCEPKV3qoyKX" target="_blank" rel="noopener">運指アプリ</a>
    <b>メトロノーム</b>
    <a href="https://claude.ai/artifact/JLKfEUDVVCBNLj22oGrLqt" target="_blank" rel="noopener" id="nav-tuner">調弦</a>
  </nav>
  <h1>メトロノーム</h1>
  <p class="lead">四分音符の速さ（♩=）で刻みます。音が出ないときは、消音スイッチを確かめてください。</p>

  <div class="panel">
    <div class="big"><span>♩=</span><b id="num">72</b></div>
    <div class="word" id="word"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <input type="range" id="bpm" min="30" max="220" step="1" value="72" aria-label="速さ">
    <div class="row">
      <button type="button" class="ghost" id="minus5" aria-label="5つ遅く">−5</button>
      <button type="button" class="ghost" id="minus" aria-label="1つ遅く">−1</button>
      <button type="button" class="ghost" id="plus" aria-label="1つ速く">＋1</button>
      <button type="button" class="ghost" id="plus5" aria-label="5つ速く">＋5</button>
    </div>
    <div class="row">
      <label for="beats">拍子</label>
      <select id="beats"><option value="1">拍子なし</option><option value="2">2拍子</option><option value="3">3拍子</option><option value="4" selected>4拍子</option><option value="6">6拍子</option></select>
      <label class="chk" for="sub8"><input type="checkbox" id="sub8">8分音符も刻む</label>
    </div>
    <div class="row">
      <button type="button" class="btn" id="go">▶ 鳴らす</button>
      <button type="button" class="ghost" id="tap">タップで合わせる</button>
    </div>
    <div class="presets" id="presets" aria-label="よく使う速さ"></div>
  </div>

  <p class="help"><b>使い方：</b>新しい曲は、まず楽譜の速さの7割くらいから。音程とリズムが崩れずに3回続けて弾けたら、4つずつ上げます。<br><b>タップで合わせる：</b>先生の弾く速さや録音に合わせて、ボタンを何回か押すと、その速さになります。</p>
</div>

<script>
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const PRESETS = [[50, "ロングトーン"], [60, "ゆっくり"], [72, "いつもの"], [84, "少し速く"], [100, "仕上げ"]];
let ac = null, wake = null;
const m = { bpm: 72, beats: 4, sub: false, on: false, next: 0, tick: 0, timer: 0, taps: [] };
function actx() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; }
function click(t, kind) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = kind === 2 ? 1760 : kind === 1 ? 1175 : 880;
  const peak = kind === 2 ? 0.5 : kind === 1 ? 0.3 : 0.12;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.06);
}
function schedule() {
  const per = m.sub ? 2 : 1;
  while (m.next < ac.currentTime + 0.12) {
    const t = m.next, sub = m.tick % per, beat = Math.floor(m.tick / per) % m.beats;
    click(t, sub ? 0 : (beat === 0 && m.beats > 1 ? 2 : 1));
    if (!sub) setTimeout(() => document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i === beat)), Math.max(0, (t - ac.currentTime) * 1000));
    m.tick++; m.next += 60 / m.bpm / per;
  }
}
async function start() {
  actx(); m.on = true; m.tick = 0; m.next = ac.currentTime + 0.08; schedule(); m.timer = setInterval(schedule, 25); render();
  try { wake = await navigator.wakeLock?.request("screen"); } catch { wake = null; }
}
function stop() {
  m.on = false; clearInterval(m.timer); document.querySelectorAll("#dots i").forEach(d => d.classList.remove("on")); render();
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
function word(b) { return b < 56 ? "ラルゴ（とてもゆっくり）" : b < 72 ? "アダージョ（ゆっくり）" : b < 92 ? "アンダンテ（歩く速さ）" : b < 116 ? "モデラート（中くらい）" : b < 150 ? "アレグロ（速く）" : "プレスト（とても速く）"; }
function setBpm(v) {
  m.bpm = Math.max(30, Math.min(220, Math.round(v)));
  $("bpm").value = m.bpm; $("num").textContent = m.bpm; $("word").textContent = word(m.bpm); store.set("mt-bpm", String(m.bpm));
  document.querySelectorAll("#presets button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === m.bpm)));
}
function dots() { const d = $("dots"); d.innerHTML = ""; for (let i = 0; i < m.beats; i++) { const x = document.createElement("i"); if (i === 0 && m.beats > 1) x.className = "first"; d.append(x); } }
function render() { $("go").textContent = m.on ? "■ 止める" : "▶ 鳴らす"; $("go").classList.toggle("stop", m.on); }

PRESETS.forEach(([v, label]) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.dataset.v = v;
  const n = document.createElement("b"); n.textContent = v; const s = document.createElement("small"); s.textContent = label;
  b.append(n, s); b.setAttribute("aria-label", label + " ♩=" + v); b.addEventListener("click", () => setBpm(v)); $("presets").append(b);
});
m.beats = Number(store.get("mt-beats")) || 4; $("beats").value = String(m.beats);
m.sub = store.get("mt-sub") === "1"; $("sub8").checked = m.sub;
setBpm(Number(store.get("mt-bpm")) || 72); dots(); render();
$("bpm").addEventListener("input", e => setBpm(Number(e.target.value)));
[["minus", -1], ["plus", 1], ["minus5", -5], ["plus5", 5]].forEach(([id, d]) => $(id).addEventListener("click", () => setBpm(m.bpm + d)));
$("go").addEventListener("click", () => m.on ? stop() : start());
$("beats").addEventListener("change", e => { m.beats = Number(e.target.value); store.set("mt-beats", e.target.value); dots(); });
$("sub8").addEventListener("change", e => { m.sub = e.target.checked; store.set("mt-sub", m.sub ? "1" : "0"); });
$("tap").addEventListener("click", () => {
  const now = performance.now(); m.taps = m.taps.filter(t => now - t < 3000); m.taps.push(now);
  if (m.taps.length >= 2) setBpm(60000 / ((m.taps[m.taps.length - 1] - m.taps[0]) / (m.taps.length - 1)));
});
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); m.on ? stop() : start(); } });
document.addEventListener("visibilitychange", async () => { if (m.on && !document.hidden && !wake) { try { wake = await navigator.wakeLock?.request("screen"); } catch {} } });
</script>

<style>/* スマホで左右にぶれないようにする。iPhone は16px未満の入力欄を押すと自動で拡大し、そのまま横に動くため */
html, body { overflow-x: clip; overscroll-behavior-x: none; touch-action: pan-y; }
@media (max-width: 768px) { input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { font-size: 16px !important; } }
</style>

<style>.wrap > nav { display: none; } .wrap { padding-block: 10px 32px; } html, body { overflow-x: clip; overscroll-behavior-x: none; touch-action: pan-y; } body::before { content: none !important; display: none !important; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } @media (max-width: 768px) { input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { font-size: 16px !important; } }</style>
</body>
</html>
