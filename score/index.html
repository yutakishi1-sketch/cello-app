<title>チェロの楽譜帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;600&display=swap">
<style>
/* 譜面台の束: 上に段ごとの目次、下に1曲1枚の譜面（羊皮紙色の紙）。各曲に「鳴らす」ボタン。
   ドヴォルザークへの道・運指アプリとそろえて、夜の青＋金の1テーマに固定 */
:root {
  color-scheme: dark;
  --bg: #0a0f1a; --bar: #080c16; --paper: #0f1727; --panel-2: #14203a;
  --ink: #ebe7dc; --ink-2: #cfcabe; --muted: #8f95a1; --line: #22304a; --frame: #3a3322;
  --gold: #c9a54e; --gold-hi: #e0c272; --gold-soft: #a8894a; --gold-dim: #6e5a2c; --on-gold: #120d05;
  --accent: var(--gold); --rosin: var(--gold-soft);
  --warn-bg: #2c250c; --warn-fg: #f1dc95;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-fine: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  --f-latin: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; font-variant-numeric: lining-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 32px; }
header { display: grid; justify-items: center; text-align: center; gap: 2px; }
.eyebrow { font-family: var(--f-latin); font-style: italic; font-weight: 600; font-size: 15px; letter-spacing: .22em; color: var(--gold); }
.divider { width: min(300px, 70%); height: auto; margin: 4px 0; opacity: .9; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 5vw, 34px); letter-spacing: .08em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.lead { font-family: var(--f-fine); color: var(--muted); margin: 4px 0 0; font-size: 14px; line-height: 1.9; max-width: 40em; }
.lead a, .foot a { color: var(--gold); font-weight: 700; }
.toc { position: relative; display: grid; gap: 10px; padding: 18px 20px; background: var(--paper); border: 1px solid var(--frame); box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 4px #2b2618; }
.toc > .corner { position: absolute; width: 34px; height: 34px; pointer-events: none; }
.corner.tl { top: -7px; left: -7px; } .corner.tr { top: -7px; right: -7px; transform: scaleX(-1); }
.corner.bl { bottom: -7px; left: -7px; transform: scaleY(-1); } .corner.br { bottom: -7px; right: -7px; transform: scale(-1, -1); }
.toc-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.toc-row b { font-size: 12.5px; color: var(--gold-soft); min-width: 6.5em; letter-spacing: .04em; }
.toc a { font-size: 13.5px; color: var(--ink); text-decoration: none; border: 1px solid var(--line); background: var(--panel-2); padding: 2px 10px; }
.toc a:hover { border-color: var(--gold); color: var(--gold); }
/* 曲は1曲ずつ開け閉めする（縦に長くなりすぎないように）。楽譜は開いたときに初めて描く */
.song { display: block; scroll-margin-top: 60px; }
.song:not([open]) { display: none; }
.wrap > .song { border-top: 1px solid var(--frame); border-bottom: 1px solid var(--frame); padding: 10px 0 14px; }
.toc a.on { border-color: var(--gold); background: var(--gold); color: var(--on-gold); font-weight: 700; }
.song > summary { list-style: none; cursor: pointer; }
.song > summary::-webkit-details-marker { display: none; }
.song-head::before { content: ""; flex: none; align-self: center; width: 9px; height: 9px; margin: 0 4px 0 2px; border: 1.5px solid var(--gold); transform: rotate(45deg); }
.song-head::after { content: "Close ▴"; margin-left: auto; font-family: var(--f-latin); font-weight: 700; letter-spacing: .08em; font-size: 14px; color: var(--gold); white-space: nowrap; }

.song[open] > .song-head::before { background: var(--gold); }
.song-body { display: grid; gap: 10px; padding-top: 10px; }
.song > .song-head { flex-wrap: nowrap; align-items: center; }
.song-head h2 { min-width: 0; }
.song-head h2 small { display: block; font-family: var(--f-fine); font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--muted); line-height: 1.4; }
@media (max-width: 520px) { .song-head h2 { font-size: 17px; letter-spacing: .02em; } .song-head .stage { font-size: 11px; white-space: nowrap; } .song:not([open]) .song-head .stage { display: none; } .song-head::after { font-size: 13px; } }
.song-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; border-bottom: 1px solid var(--frame); padding-bottom: 6px; }
.stage { font-size: 12px; font-weight: 700; color: var(--gold-soft); border: 1px solid var(--gold-dim); padding: 0 6px; }
.tip { font-family: var(--f-fine); font-size: 14px; line-height: 1.85; color: var(--ink-2); margin: 0; }
.warn { font-size: 13px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid #6b5a1f; padding: 4px 10px; margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.controls button { font: inherit; font-weight: 700; font-size: 13.5px; border: 0; padding: 0 16px; min-height: 40px; background: var(--gold); color: var(--on-gold); cursor: pointer; }
.controls button.on { background: var(--panel-2); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.controls button:disabled { opacity: .5; cursor: default; }
.controls label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.controls input[type=checkbox] { accent-color: var(--gold); }
.controls .speed { color: var(--ink); font-weight: 700; }
.controls .speed input { width: 140px; accent-color: var(--gold); }
.controls .speed output { font-family: var(--f-latin); font-size: 17px; font-variant-numeric: lining-nums tabular-nums; min-width: 2.2em; display: inline-block; color: var(--gold); }
.controls button.ghost { background: none; color: var(--gold); border: 1px solid var(--gold-dim); font-weight: 500; }
.meter { font-family: var(--f-fine); font-size: 13px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.sheet { background: var(--paper); color: var(--ink); border: 1px solid var(--frame); box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px #2b2618; padding: 8px 6px; overflow-x: auto; }
/* 楽譜は白抜き: 五線と音符は羊皮紙の白、指番号は金、弦の名前は淡い金 */
.sheet .abcjs-annotation.fg { fill: var(--gold-hi); font-weight: 700; }
.sheet .abcjs-annotation { fill: var(--gold-soft); }
.sheet .abcjs-tempo { fill: var(--muted); }
.sheet svg { max-width: 100%; height: auto; }
.foot { font-family: var(--f-fine); font-size: 12.5px; color: var(--muted); }
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.pages { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); border-bottom: 1px solid var(--frame); }
.pages div { max-width: 820px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; }
.pages a { display: flex; align-items: center; min-height: 44px; text-decoration: none; color: var(--ink); }
.pages a:first-child { color: var(--gold); font-weight: 700; }
.pages span { flex: 1 1 auto; }
</style>

    <h1>チェロの楽譜帳</h1>
    <img class="divider" src="art/divider.png" alt="">
    <p class="lead">練習表の曲のうち、著作権の切れた曲をチェロ用に書き起こしたものです。全部第1ポジション、音符の上の数字が指番号（0＝開放弦）、下が弦です。<br><a href="https://claude.ai/artifact/6fdtu9w1SfjjCJWArFDatt">練習表へ戻る</a></p>
  </header>
  <nav class="toc" id="toc" aria-label="曲の目次"><img class="corner tl" src="art/corner.png" alt=""><img class="corner tr" src="art/corner.png" alt=""><img class="corner bl" src="art/corner.png" alt=""><img class="corner br" src="art/corner.png" alt=""></nav>
  <main id="songs" hidden></main>
  <p class="foot" id="fallback" hidden>楽譜の表示部品を読み込めませんでした。時間をおいて開き直してください。</p>
  <p class="foot">どの曲もパブリックドメインの旋律を、初心者のチェロ向けに調と音域を選び直したものです。カノンの低音のやさしい版（2分音符・1オクターブ上）は<a href="https://claude.ai/artifact/J11qb7dDwnQzn2vVs6TPqB">別ページ</a>にあります。</p>

const $ = id => document.getElementById(id);
const toc = $("toc"), main = $("songs");
STAGE.forEach((name, i) => {
  const list = SONGS.filter(s => s.stage === i); if (!list.length) return;
  const row = document.createElement("div"); row.className = "toc-row";
  const b = document.createElement("b"); b.textContent = name; row.append(b);
  list.forEach(s => { const a = document.createElement("a"); a.href = "#" + s.id; a.textContent = s.title; row.append(a); });
  toc.append(row);
});

let ctx = null, playing = null;
function stopAll() {
  if (!playing) return;
  playing.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  clearTimeout(playing.timer); playing.btn.textContent = "▶ 鳴らす"; playing.btn.classList.remove("on"); playing = null;
}
// 拍子は abc の M: から。6/8 のように「付点4分を1拍」と数える曲は beatLength が 3/8 になる
function meterOf(song) {
  const m = /^M:(\d+)\/(\d+)/m.exec(song.abc);
  const num = m ? Number(m[1]) : 4, den = m ? Number(m[2]) : 4;
  const beat = song.tune && song.tune.getBeatLength ? song.tune.getBeatLength() : 1 / den;
  return { num, den, bar: num / den, beat, perBar: Math.max(1, Math.round(num / den / beat)) };
}
function tone(t, d, freq, type, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + d * 0.8); g.gain.linearRampToValueAtTime(0, t + d * 0.96);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + d);
  return o;
}
function playSong(song, btn, opts) {
  stopAll();
  let seq;
  try { seq = song.tune.setUpAudio({}); } catch (e) { btn.disabled = true; btn.textContent = "音を出せません"; return; }
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); }
  catch (e) { btn.disabled = true; btn.textContent = "音を出せません"; return; }
  const mt = meterOf(song);
  const whole = 60 / opts.bpm / mt.beat;
  const pickup = song.tune.getPickupLength ? song.tune.getPickupLength() : 0;
  const countIn = mt.perBar * mt.beat * whole;
  const tc = ctx.currentTime + 0.15, t0 = tc + countIn, nodes = [];
  for (let k = 0; k < mt.perBar; k++) nodes.push(tone(tc + k * mt.beat * whole, 0.06, k === 0 ? 1760 : 1320, "square", 0.08));
  let end = 0;
  (seq.tracks || []).forEach(track => track.forEach(ev => {
    if (ev.cmd !== "note" || ev.pitch == null) return;
    const d = ev.duration * whole;
    nodes.push(tone(t0 + ev.start * whole, d, 440 * Math.pow(2, (ev.pitch - 69) / 12), "triangle", 0.3));
    end = Math.max(end, ev.start + ev.duration);
  }));
  if (opts.click) {
    const first = pickup - Math.floor(pickup / mt.beat + 1e-6) * mt.beat;
    for (let p = first, i = 0; p < end - 1e-6; p += mt.beat, i++) {
      const down = Math.abs(((p - pickup) / mt.beat) % mt.perBar) < 1e-6;
      nodes.push(tone(t0 + p * whole, 0.05, down ? 1760 : 1320, "square", down ? 0.07 : 0.04));
    }
  }
  btn.textContent = "■ 止める"; btn.classList.add("on");
  const total = countIn + end * whole;
  playing = { nodes, btn, timer: setTimeout(() => { const again = opts.loop(); stopAll(); if (again) playSong(song, btn, opts); }, (total + 0.3) * 1000) };
}

const ok = !!window.ABCJS;
if (!ok) $("fallback").hidden = false;
SONGS.forEach(s => {
  const sec = document.createElement("details"); sec.className = "song"; sec.id = s.id;
  const head = document.createElement("summary"); head.className = "song-head";
  const body = document.createElement("div"); body.className = "song-body";
  const h = document.createElement("h2");
  // 曲名の（…）は小さく2行目へ。閉じた一覧が縦に伸びないように
  const tm = s.title.match(/^(.+?)\s*(（.+）)$/);
  h.textContent = tm ? tm[1] : s.title;
  if (tm) { const sub = document.createElement("small"); sub.textContent = tm[2]; h.append(sub); }
  const st = document.createElement("span"); st.className = "stage"; st.textContent = STAGE[s.stage];
  head.append(h, st); sec.append(head, body);
  const tip = document.createElement("p"); tip.className = "tip"; tip.textContent = s.tip; body.append(tip);
  if (s.warn) { const w = document.createElement("p"); w.className = "warn"; w.textContent = s.warn; body.append(w); }
  const meterLine = document.createElement("p"); meterLine.className = "meter"; body.append(meterLine);
  const ctr = document.createElement("div"); ctr.className = "controls";
  const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "▶ 鳴らす";
  const speed = document.createElement("label"); speed.className = "speed";
  const mark = document.createElement("span"); mark.textContent = "♩=";
  const range = document.createElement("input"); range.type = "range"; range.id = "bpm-" + s.id; range.setAttribute("aria-label", s.title + "の速さ");
  const val = document.createElement("output"); val.htmlFor = range.id;
  speed.append(mark, range, val);
  const reset = document.createElement("button"); reset.type = "button"; reset.className = "ghost"; reset.textContent = "ふつうに戻す";
  const clickLab = document.createElement("label"); const click = document.createElement("input"); click.type = "checkbox"; click.id = "click-" + s.id; clickLab.append(click, "メトロノーム");
  const loopLab = document.createElement("label"); const loop = document.createElement("input"); loop.type = "checkbox"; loop.id = "loop-" + s.id; loopLab.append(loop, "くり返し");
  ctr.append(btn, speed, reset, clickLab, loopLab); body.append(ctr);
  const sheet = document.createElement("div"); sheet.className = "sheet"; sheet.id = "sheet-" + s.id; body.append(sheet);
  main.append(sec);
  // 閉じたままの曲は文字の幅が測れないので、開いたときに初めて楽譜を描く
  let ready = false, base = 80;
  const prepare = () => {
    if (ready) return; ready = true;
    if (ok) {
      try { s.tune = ABCJS.renderAbc(sheet, "X:1\n" + s.abc, { responsive: "resize", add_classes: true, paddingtop: 4, paddingbottom: 4, foregroundColor: "#ebe7dc" })[0];
        sheet.querySelectorAll("text.abcjs-annotation").forEach(n => { if (/^[0-4]$/.test(n.textContent.trim())) n.classList.add("fg"); }); }
      catch (e) { console.error(s.id, e); }
    }
    btn.disabled = !s.tune;
    const mt = meterOf(s); base = s.tune ? Math.round(s.tune.getBpm()) : 80;
    const dotted = Math.abs(mt.beat - 0.375) < 1e-6, beatSym = dotted ? "♩." : "♩";
    mark.textContent = beatSym + "=";
    meterLine.textContent = mt.num + "/" + mt.den + "拍子：1小節を" + mt.perBar + "つに数える（1拍＝" + (dotted ? "付点4分音符" : "4分音符") + "）。ふつうの速さは " + beatSym + "=" + base + "。";
    range.min = String(Math.max(30, Math.round(base * 0.5))); range.max = String(Math.round(base * 1.6)); range.step = "1"; range.value = String(base);
    val.textContent = range.value;
  };
  sec.addEventListener("toggle", () => {
    if (sec.open) prepare(); else if (playing && playing.btn === btn) stopAll();
    const link = toc.querySelector('.toc-row a[href="#' + s.id + '"]'); if (link) link.classList.toggle("on", sec.open);
  });
  const opts = () => ({ bpm: Number(range.value), click: click.checked, loop: () => loop.checked });
  const restartIfPlaying = () => { if (playing && playing.btn === btn) playSong(s, btn, opts()); };
  range.addEventListener("input", () => { val.textContent = range.value; });
  range.addEventListener("change", restartIfPlaying);
  click.addEventListener("change", restartIfPlaying);
  reset.addEventListener("click", () => { range.value = String(base); val.textContent = range.value; restartIfPlaying(); });
  btn.addEventListener("click", () => (playing && playing.btn === btn) ? stopAll() : playSong(s, btn, opts()));
});
const HASH_ALIAS = { "#canonmelody": "#canon-melody" };   // 前の目印で開いても新しい段へ
// 目次や目印で曲を指したら、その曲を開いてそこへ移る
function openSong(hash) {
  if (!hash || !/^#[A-Za-z0-9_-]+$/.test(hash)) return;
  const target = document.querySelector(HASH_ALIAS[hash] || hash);
  if (!target || !target.classList.contains("song")) return;
  document.querySelectorAll(".song[open]").forEach(d => { if (d !== target) d.open = false; });
  toc.before(target);   // 楽譜は目次の枠の上（見出しのすぐ下）に出す
  target.open = true;
  setTimeout(() => target.scrollIntoView({ block: "start" }), 60);
}
toc.addEventListener("click", e => {
  const a = e.target.closest(".toc-row a[href^='#']"); if (!a) return;
  e.preventDefault();
  const target = document.querySelector(a.getAttribute("href"));
  if (target && target.open) { target.open = false; return; }
  openSong(a.getAttribute("href"));
  try { history.replaceState(null, "", a.getAttribute("href")); } catch (err) { /* 書き換えられない画面でも開くだけはする */ }
});
addEventListener("hashchange", () => openSong(location.hash));
openSong(location.hash);
</script>
